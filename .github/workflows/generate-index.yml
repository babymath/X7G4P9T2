name: Generate Directory Index

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index.html
        run: |
          cat << 'EOF' > generate.py
          import os
          from pathlib import Path

          output_file = "index.html"
          # Ignored directory names
          ignored_dirs = {".git", ".github", ".vscode"}
          # Set of allowed extensions (empty set means allow ALL files)
          allowed_exts = {".html", ".htm", ".pdf", ".md", ".txt", ".png", ".jpg", ".jpeg", ".svg"}

          def build_nested_tree(base_path):
              tree = {"__dirs__": {}, "__files__": []}
              
              for root, dirs, files in os.walk(base_path):
                  # Remove ignored directories in-place so os.walk skips them
                  dirs[:] = [d for d in dirs if d not in ignored_dirs and not d.startswith(".")]
                  
                  rel_root = os.path.relpath(root, base_path)
                  parts = Path(rel_root).parts if rel_root != "." else ()
                  
                  # Traverse to current node
                  curr = tree
                  for p in parts:
                      curr = curr["__dirs__"].setdefault(p, {"__dirs__": {}, "__files__": []})
                  
                  # Add valid files to current node
                  for f in sorted(files):
                      if f.startswith(".") or f == output_file or f == "generate.py":
                          continue
                      ext = Path(f).suffix.lower()
                      if not allowed_exts or ext in allowed_exts:
                          full_rel_path = (Path(rel_root) / f).as_posix().lstrip("./")
                          curr["__files__"].append((f, full_rel_path))
              return tree

          def render_html(node):
              items = []
              # 1. Render Subdirectories
              for dirname, subnode in sorted(node["__dirs__"].items()):
                  has_content = subnode["__files__"] or subnode["__dirs__"]
                  if has_content:
                      items.append(f'<li><details open><summary>📁 <strong>{dirname}</strong></summary>')
                      items.append(f'<ul>{render_html(subnode)}</ul>')
                      items.append('</details></li>')
              
              # 2. Render Files in current directory
              for fname, fpath in sorted(node["__files__"]):
                  items.append(f'<li>📄 <a href="{fpath}">{fname}</a></li>')
                  
              return "\n".join(items)

          tree = build_nested_tree(".")
          rendered_list = render_html(tree)

          html_template = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Repository Index</title>
            <style>
              body {{
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                margin: 2rem auto;
                max-width: 800px;
                padding: 0 1rem;
                line-height: 1.6;
              }}
              ul {{ list-style-type: none; padding-left: 1.5rem; }}
              li {{ margin: 0.3rem 0; }}
              summary {{ cursor: pointer; color: #0366d6; font-weight: 600; }}
              a {{ color: #24292e; text-decoration: none; }}
              a:hover {{ text-decoration: underline; color: #0366d6; }}
            </style>
          </head>
          <body>
            <h1>Repository Directory</h1>
            <ul>
              {rendered_list}
            </ul>
          </body>
          </html>"""

          with open(output_file, "w", encoding="utf-8") as f:
              f.write(html_template)
          EOF
          python3 generate.py
          rm generate.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update nested index.html" && git push)
