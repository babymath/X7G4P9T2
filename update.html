<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 0;
      margin: 0;
    }
  #loginSection, #buttons{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgb(113, 57, 165);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(221, 43, 43, 0.1);
      margin: 20px;
    }

    h2 {
      color: #333;
    }

    input {
      width: 250px;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
  

    #buttons button {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    #logout {
      background-color: #f44336;
    }

    /* Popup styles */
    #popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #popupContent {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="popup" onclick="hidePopup(event)">
    <div id="popupContent"></div>
  </div>

  <div id="loginSection">
    <h2>Login to BabyMath</h2>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
  </div>

  <div id="buttons" style="display: none;">
    <h2>Welcome!</h2>
    <button onclick="uploadToDatabase()">Local to Database</button>
    <button onclick="downloadFromDatabase()">Database to Local</button><br><br>
    <button id="logout" onclick="logout()">Logout</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const gameKeys = [
      "111-100", "111-200", "222-100", "222-200",
      "333-100", "333-200", "444-100", "444-200",
      "555-100", "555-200", "666-100", "666-200",
      "777-100", "777-200"
    ];

    let currentEmail = "";

    // Check if user is already logged in
    window.onload = function () {
      const savedEmail = localStorage.getItem("loggedInUser");
      if (savedEmail) {
        currentEmail = savedEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("buttons").style.display = "block";
      }
    };

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      db.collection("babymath").doc(email).get().then(doc => {
        if (!doc.exists) {
          showPopup("User not found");
          return;
        }

        const data = doc.data();
        if (data.password !== password) {
          showPopup("Wrong password");
          return;
        }

        currentEmail = email;
        localStorage.setItem("loggedInUser", email);
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("buttons").style.display = "block";
        showPopup("Login successful");
      }).catch(error => {
        console.error("Login error:", error);
        showPopup("Login failed");
      });
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      location.reload();
    }

    function downloadFromDatabase() {
      if (!currentEmail) return;

      db.collection("babymath").doc(currentEmail).get().then(doc => {
        if (doc.exists) {
          const games = doc.data().games || {};
          for (let key in games) {
            localStorage.setItem(key, games[key]);
            console.log(`Set ${key}: ${games[key]}`);
          }
          showPopup("Downloaded to localStorage");
        }
      }).catch(err => {
        console.error("Download error:", err);
        showPopup("Failed to fetch games");
      });
    }

    function uploadToDatabase() {
      if (!currentEmail) return;

      const games = {};
      gameKeys.forEach(key => {
        const value = localStorage.getItem(key);
        if (value !== null) {
          games[key] = parseInt(value);
        }
      });

      db.collection("babymath").doc(currentEmail).update({ games }).then(() => {
        showPopup("Uploaded to database");
      }).catch(err => {
        console.error("Upload error:", err);
        showPopup("Failed to upload");
      });
    }

    function showPopup(message) {
      document.getElementById("popupContent").textContent = message;
      document.getElementById("popup").style.display = "flex";
    }

    function hidePopup(event) {
      if (event.target.id === "popup") {
        document.getElementById("popup").style.display = "none";
      }
    }
  </script>

</body>
</html>
