<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: "green";
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    #loginSection, #buttons {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 250px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    #logout {
      background-color: #f44336;
    }

    #logout:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div id="loginSection">
    <h2>Login to BabyMath</h2>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
  </div>

  <div id="buttons" style="display: none;">
    <h2>Welcome!</h2>
    <button onclick="uploadToDatabase()">Local to Database</button>
    <button onclick="downloadFromDatabase()">Database to Local</button><br><br>
    <button id="logout" onclick="logout()">Logout</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const gameKeys = [
      "111-100", "111-200", "222-100", "222-200",
      "333-100", "333-200", "444-100", "444-200",
      "555-100", "555-200", "666-100", "666-200",
      "777-100", "777-200"
    ];

    let currentEmail = "";

    // Check if user is already logged in
    window.onload = function () {
      const savedEmail = localStorage.getItem("loggedInUser");
      if (savedEmail) {
        currentEmail = savedEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("buttons").style.display = "block";
      }
    };

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      db.collection("babymath").doc(email).get().then(doc => {
        if (!doc.exists) {
          alert("User not found");
          return;
        }

        const data = doc.data();
        if (data.password !== password) {
          alert("Wrong password");
          return;
        }

        currentEmail = email;
        localStorage.setItem("loggedInUser", email);
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("buttons").style.display = "block";
        alert("Login successful");
      }).catch(error => {
        console.error("Login error:", error);
        alert("Login failed");
      });
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      location.reload();
    }

    function downloadFromDatabase() {
      if (!currentEmail) return;

      db.collection("babymath").doc(currentEmail).get().then(doc => {
        if (doc.exists) {
          const games = doc.data().games || {};
          for (let key in games) {
            localStorage.setItem(key, games[key]);
            console.log(`Set ${key}: ${games[key]}`);
          }
          alert("Downloaded to localStorage");
        }
      }).catch(err => {
        console.error("Download error:", err);
        alert("Failed to fetch games");
      });
    }

    function uploadToDatabase() {
      if (!currentEmail) return;

      const games = {};
      gameKeys.forEach(key => {
        const value = localStorage.getItem(key);
        if (value !== null) {
          games[key] = parseInt(value);
        }
      });

      db.collection("babymath").doc(currentEmail).update({ games }).then(() => {
        alert("Uploaded to database");
      }).catch(err => {
        console.error("Upload error:", err);
        alert("Failed to upload");
      });
    }
  </script>

</body>
</html>
