<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    #buttons { display: none; margin-top: 20px; }
    button { margin: 5px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h2>Login to BabyMath</h2>
  <input type="text" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>

  <div id="buttons">
    <button onclick="localToDB()">Local to Database</button>
    <button onclick="dbToLocal()">Database to Local</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userDocId = "";
    let userGames = {};

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) return alert("Enter email and password");

      try {
        const docRef = db.collection("babymath").doc(email);
        const doc = await docRef.get();

        if (!doc.exists) {
          alert("Login failed: User not found");
          return;
        }

        const data = doc.data();
        if (data.password !== password) {
          alert("Login failed: Incorrect password");
          return;
        }

        userDocId = email;
        userGames = data.games || {};
        document.querySelector("button").style.display = "none";
        document.getElementById("buttons").style.display = "block";
        alert("Login successful");
      } catch (err) {
        console.error(err);
        alert("Error logging in");
      }
    }

    async function localToDB() {
      const localGames = JSON.parse(localStorage.getItem("games") || "{}");

      try {
        await db.collection("babymath").doc(userDocId).update({
          games: { ...userGames, ...localGames } // merge without overwriting
        });
        alert("Local data synced to database");
      } catch (err) {
        console.error(err);
        alert("Error uploading to DB");
      }
    }

    async function dbToLocal() {
      try {
        const doc = await db.collection("babymath").doc(userDocId).get();
        if (doc.exists) {
          localStorage.setItem("games", JSON.stringify(doc.data().games));
          alert("Database data saved locally");
        } else {
          alert("Document not found");
        }
      } catch (err) {
        console.error(err);
        alert("Error fetching from DB");
      }
    }
  </script>
</body>
</html>
