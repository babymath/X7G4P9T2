<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    #buttons { display: none; }
  </style>
</head>
<body>
  <h2>BabyMath Login</h2>
  <div id="login">
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>

  <div id="buttons">
    <h3>Welcome!</h3>
    <button onclick="localToDatabase()">Local to Database</button>
    <button onclick="databaseToLocal()">Database to Local</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userEmail = "";
    let field = {};

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) {
        document.getElementById("error").textContent = "Please fill in all fields.";
        return;
      }

      try {
        const docRef = db.collection("babymath").doc(email);
        const doc = await docRef.get();

        if (!doc.exists) {
          document.getElementById("error").textContent = "Account not found.";
        } else {
          const data = doc.data();
          if (data.password === password) {
            userEmail = email;
            field = data;
            document.getElementById("login").style.display = "none";
            document.getElementById("buttons").style.display = "block";
          } else {
            document.getElementById("error").textContent = "Incorrect password.";
          }
        }
      } catch (e) {
        document.getElementById("error").textContent = "Error logging in.";
        console.error(e);
      }
    }

    function localToDatabase() {
      // Save `field.games` from localStorage to Firestore
      const games = JSON.parse(localStorage.getItem("games")) || {};
      db.collection("babymath").doc(userEmail).update({ games }).then(() => {
        alert("Games saved to database.");
      });
    }

    function databaseToLocal() {
      // Load `games` from Firestore and store in localStorage
      localStorage.setItem("games", JSON.stringify(field.games || {}));
      alert("Games loaded to local storage.");
    }
  </script>
</body>
</html>
