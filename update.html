<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }
    input, button {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 90%;
    }
  </style>
</head>
<body>

  <h2>BabyMath Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="manualLogin()">Login</button>
  <button onclick="uploadToDatabase()">Local to Database</button>
  <button onclick="downloadFromDatabase()">Database to Local</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserEmail = "";

    let localGames = {
      "111-100": 0, "111-200": 0,
      "222-100": 0, "222-200": 0,
      "333-100": 0, "333-200": 0,
      "444-100": 0, "444-200": 0,
      "555-100": 0, "555-200": 0,
      "666-100": 0, "666-200": 0,
      "777-100": 0, "777-200": 0
    };

    function manualLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      db.collection("babymath").doc(email).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          if (data.password === password) {
            currentUserEmail = email;
            localGames = { ...localGames, ...data.games };
            alert("Login successful!");
          } else {
            alert("Incorrect password.");
          }
        } else {
          alert("User not found.");
        }
      }).catch((error) => {
        console.error("Login error:", error);
        alert("Login failed.");
      });
    }

    function uploadToDatabase() {
      if (!currentUserEmail) {
        alert("Login first.");
        return;
      }

      db.collection("babymath").doc(currentUserEmail).update({
        games: localGames
      }).then(() => {
        alert("Uploaded to database.");
      }).catch((error) => {
        console.error("Upload error:", error);
      });
    }

    function downloadFromDatabase() {
      if (!currentUserEmail) {
        alert("Login first.");
        return;
      }

      db.collection("babymath").doc(currentUserEmail).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          localGames = { ...localGames, ...data.games };
          alert("Downloaded to local.");
        }
      }).catch((error) => {
        console.error("Download error:", error);
      });
    }
  </script>
</body>
</html>
