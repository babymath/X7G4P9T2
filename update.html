<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BabyMath Login</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #357bd8;
    }
    #buttons {
      display: none;
      gap: 15px;
      margin-top: 20px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #logoutBtn {
      background-color: #e94e4e;
    }
  </style>
</head>
<body>

  <div class="card" id="loginSection">
    <h2>Login to BabyMath</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="loginError" style="color: red; margin-top: 10px;"></p>
  </div>

  <div class="btn-group" id="buttons">
    <button onclick="uploadToDatabase()">Upload to Database</button>
    <button onclick="downloadToLocal()">Download to Local</button>
    <button id="logoutBtn" onclick="logout()">Logout</button>
  </div>

  <!-- Firebase scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collection = "babymath";

    let currentEmail = "";

    const field = {
      password: "",
      games: {
        "111-100": 0,
        "111-200": 0,
        "222-100": 0,
        "222-200": 0,
        "333-100": 0,
        "333-200": 0,
        "444-100": 0,
        "444-200": 0,
        "555-100": 0,
        "555-200": 0,
        "666-100": 0,
        "666-200": 0,
        "777-100": 0,
        "777-200": 0,
      }
    };

    // Check for existing session
    window.onload = () => {
      const saved = localStorage.getItem("loggedInUser");
      if (saved) {
        currentEmail = saved;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("buttons").style.display = "flex";
      }
    };

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorEl = document.getElementById("loginError");

      if (!email || !password) {
        errorEl.textContent = "Please fill in both fields.";
        return;
      }

      db.collection(collection).doc(email).get().then(doc => {
        if (doc.exists && doc.data().password === password) {
          currentEmail = email;
          localStorage.setItem("loggedInUser", email);
          errorEl.textContent = "";
          document.getElementById("loginSection").style.display = "none";
          document.getElementById("buttons").style.display = "flex";
        } else {
          errorEl.textContent = "Invalid credentials.";
        }
      }).catch(err => {
        errorEl.textContent = "Error: " + err.message;
      });
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      location.reload();
    }

    function uploadToDatabase() {
      const savedGames = JSON.parse(localStorage.getItem("games")) || field.games;
      db.collection(collection).doc(currentEmail).update({
        games: savedGames
      }).then(() => {
        alert("Uploaded to database!");
      }).catch(err => {
        alert("Upload failed: " + err.message);
      });
    }

    function downloadToLocal() {
      db.collection(collection).doc(currentEmail).get().then(doc => {
        if (doc.exists) {
          const dbGames = doc.data().games || {};
          localStorage.setItem("games", JSON.stringify(dbGames));
          alert("Downloaded to localStorage!");
        }
      }).catch(err => {
        alert("Download failed: " + err.message);
      });
    }
  </script>
</body>
</html>
