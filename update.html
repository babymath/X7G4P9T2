<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BabyMath Login</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button { margin: 5px; padding: 10px; width: 250px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>

  <h3>Sync Options</h3>
  <button onclick="localToDatabase()">Local to Database</button>
  <button onclick="databaseToLocal()">Database to Local</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.firebasestorage.app",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserEmail = "";

    const field = {
      password: "",
      games: {
        "111-100": 0, "111-200": 0,
        "222-100": 0, "222-200": 0,
        "333-100": 0, "333-200": 0,
        "444-100": 0, "444-200": 0,
        "555-100": 0, "555-200": 0,
        "666-100": 0, "666-200": 0,
        "777-100": 0, "777-200": 0
      }
    };

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          currentUserEmail = email;
          alert("Login successful");
        })
        .catch(error => {
          alert("Login failed: " + error.message);
        });
    }

    function localToDatabase() {
      if (!currentUserEmail) return alert("Please log in first.");
      db.collection("babymath").doc(currentUserEmail).set(field, { merge: true })
        .then(() => alert("Data synced to database."))
        .catch(error => alert("Error: " + error.message));
    }

    function databaseToLocal() {
      if (!currentUserEmail) return alert("Please log in first.");
      db.collection("babymath").doc(currentUserEmail).get()
        .then(doc => {
          if (doc.exists) {
            const data = doc.data();
            field.password = data.password || field.password;
            field.games = { ...field.games, ...data.games };
            alert("Data synced to local.");
          } else {
            alert("No data found in database.");
          }
        })
        .catch(error => alert("Error: " + error.message));
    }
  </script>

</body>
</html>
