<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #buttons { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
  <p id="result"></p>

  <div id="buttons">
    <button onclick="localToDb()">Local to Database</button>
    <button onclick="dbToLocal()">Database to Local</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserEmail = "";
    let games = {
      "111-100": false, "111-200": false,
      "222-100": false, "222-200": false,
      "333-100": false, "333-200": false,
      "444-100": false, "444-200": false,
      "555-100": false, "555-200": false,
      "666-100": false, "666-200": false,
      "777-100": false, "777-200": false
    };

    const field = { password: "", games };

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      document.getElementById("result").textContent = "Checking...";

      try {
        const docRef = db.collection("babymath").doc(email);
        const doc = await docRef.get();

        if (doc.exists && doc.data().password === password) {
          field.password = password;
          Object.assign(games, doc.data().games || {});
          currentUserEmail = email;
          document.getElementById("result").textContent = "Login successful!";
          document.getElementById("buttons").style.display = "block";
        } else {
          document.getElementById("result").textContent = "Login failed!";
        }
      } catch (error) {
        document.getElementById("result").textContent = "Error logging in.";
        console.error(error);
      }
    }

    async function localToDb() {
      if (!currentUserEmail) return;
      try {
        await db.collection("babymath").doc(currentUserEmail).update({ games });
        alert("Local data synced to database.");
      } catch (error) {
        alert("Error syncing to database.");
        console.error(error);
      }
    }

    async function dbToLocal() {
      if (!currentUserEmail) return;
      try {
        const doc = await db.collection("babymath").doc(currentUserEmail).get();
        if (doc.exists) {
          Object.assign(games, doc.data().games || {});
          alert("Database data loaded to local.");
        }
      } catch (error) {
        alert("Error loading from database.");
        console.error(error);
      }
    }
  </script>
</body>
</html>
