<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="aadhaar/img/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyMath Quiz</title>
    <link rel="stylesheet" href="aadhaar/test.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&display=swap" rel="stylesheet"> <!-- Add Hindi font -->
</head>
<body>
    <div id="langSelection"">
            <h2>Choose Your Language</h2>
            <button class="lang-btn" onclick="setLang('hindi')">हिन्दी</button>
            <button class="lang-btn" onclick="setLang('english')">English</button>
    </div> 
    <div id="quizSelection" style="display: none;">
        <h2>Select a Quiz</h2>
        <div id="quizFilter">
            <label for="subjectFilter">Filter by Subject:</label>
            <select id="subjectFilter">
                <option value="All">All</option>
                <!-- Options will be added dynamically -->
            </select>
        </div>
        <div id="quizList"></div>
    </div>

    <div id="test" style="display: none;">
        <div id="quiz-container">
            <div class="navigation" id="navButtons"></div>
            <h2 id="quizTitle"></h2>
            <div id="question-container">
            <h2 id="question-text"></h2>
            <div id="options-container"></div>
            <div id="prev-next">
                <button onclick="prevQuestion()">Previous</button>
                <button onclick="nextQuestion()">Next</button>
            </div>
            </div>
            <div id="preview-submit">
                <button onclick="showPreview()">Preview</button>
                <button onclick="submitQuiz()">Submit</button>
            </div>
        </div>
        <!-- Preview Popup -->
        <div class="popup" id="previewPopup" style="display: none;">
            <div id="preview-title">
                <h2>Preview Your Respnse</h2>
                <button onclick="closePopup('previewPopup')">Close</button>
            </div>
            <div id="preview-content"></div>
            <button onclick="closePopup('previewPopup')">Close</button>
        </div>
    </div>
    <div id="result" style="display: none;">
        <button onclick="location.reload()">Restart</button> <!-- Add onclick to reload the page -->
        <h2>Results</h2>
        <div id="results-container"></div>
        <div id="summary"></div>
    </div>
    <script src="change/quizzes.js"></script>
    <script src="aadhaar/test.js"></script>
</body>
</html>
