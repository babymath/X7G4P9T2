<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
<link rel="stylesheet" href="update.css">

</head>
<body>
<div id="login-section">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button id="loginBtn" onclick="login()">🔑 Login</button>
  </div>

  <div id="buttons" style="display: none;">
    <button onclick="showConfirm('upload')">⬆️ Local to Database</button>
    <button onclick="showConfirm('download')">⬇️ Database to Local</button>
    <button id="logout" onclick="logout()">🚪 Logout</button>
  </div>
<div id="leaderboard-section">
  <h3>Leaderboard <button onclick="loadLeaderboard()">🔄 Refresh</button></h3>
  <table id="leaderboard">
    <thead>
      <tr>
        <th>Email</th>
        <th>G-Point</th>
        <th>Last Date</th>
        <th>Last Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
  <div class="overlay" onclick="closePopup()"></div>
  <div class="popup" id="popup"></div>

  <div id="confirmBox" class="dialog-overlay">
    <div class="dialog-box">
      <p id="confirmMessage">Are you sure?</p>
      <p>After clicking Yes, your score will be changed.</p>
      <div class="dialog-buttons">
        <button onclick="confirmYes()">✅ Yes</button>
        <button onclick="hideConfirm()">❌ No</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="update.js"></script>
</body>
</html>
