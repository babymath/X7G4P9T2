<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #offline-message {
            font-size: 18px;
            font-weight: bold;
            color: #ff5555;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        #score {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        canvas {
            border-radius: 10px;
            background: black;
        }
        /* Restart Button */
        .restart-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffcc00;
            color: black;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }
        .restart-button:hover {
            background: #ffa500;
        }
    </style>
</head>
<body>
    <div id="offline-message">You are offline</div>
    <h1>Tap to Jump!</h1>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas"></canvas>
    <button class="restart-button" id="restartButton" onclick="restartGame()">Restart</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const restartButton = document.getElementById("restartButton");
        const scoreDisplay = document.getElementById("score");

        canvas.width = 300;
        canvas.height = 400;

        let player, gravity, isJumping, obstacles, speed, score, gameRunning;

        function initGame() {
            player = { x: 50, y: 350, width: 30, height: 30, dy: 0 };
            gravity = 0.5;
            isJumping = false;
            obstacles = [];
            speed = 3;
            score = 0;
            gameRunning = true;
            restartButton.style.display = "none";
            updateScore();
            update();
        }

        function drawPlayer() {
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function drawObstacles() {
            ctx.fillStyle = "#ff0044";
            obstacles.forEach((obs) => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
        }

        function update() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            player.dy += gravity;
            player.y += player.dy;

            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                isJumping = false;
            }

            obstacles.forEach((obs, index) => {
                obs.x -= speed;

                if (obs.x + obs.width < 0) {
                    obstacles.splice(index, 1);
                    score++;
                    updateScore();
                }

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver();
                }
            });

            drawPlayer();
            drawObstacles();

            requestAnimationFrame(update);
        }

        function jump() {
            if (!isJumping && gameRunning) {
                player.dy = -10;
                isJumping = true;
            }
        }

        function spawnObstacle() {
            if (gameRunning) {
                let height = Math.random() * 50 + 20;
                obstacles.push({ x: canvas.width, y: canvas.height - height, width: 20, height: height });
            }
        }

        function gameOver() {
            gameRunning = false;
            restartButton.style.display = "block"; // Show restart button in center
        }

        function restartGame() {
            initGame();
        }

        function updateScore() {
            scoreDisplay.innerText = "Score: " + score;
        }

        setInterval(spawnObstacle, 2000);
        initGame();

        window.addEventListener("click", jump);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service Worker registered successfully.'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
