<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyMath Quiz</title>
    <link rel="icon" type="image/x-icon" href="aadhaar/img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            margin: 0;
            background-color: #f0f8ff;
            padding: 0;
        }

        #quiz-container {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        #language-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .language-button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
        }

        #quiz-content, #result-section {
            display: none;
        }

        .question-section {
            margin-bottom: 20px;
        }

        .options-section label {
            display: block;
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .navigation-section {
            display: flex;
            justify-content: space-between;
        }

        .navigation-button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #00bfff;
            color: white;
            cursor: pointer;
        }

        .preview-button, .submit-button, #restart-button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #3cb371;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .preview-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
            z-index: 1000;
            text-align: left;
        }

        .preview-popup h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .preview-popup button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #d32f2f;
            color: white;
            cursor: pointer;
            margin: 0;
            text-align: center;
        }
        .preview-popup .top-close {
            position: sticky;
            top: 0;
            display: block;
            width: 100%;
            text-align: center;
        }

        #navigation-numbers {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        #navigation-numbers button {
            padding: 8px 12px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #navigation-numbers button.current {
            background-color: #007bff;
            color: white;
        }
        #navigation-numbers button.answered {
            background-color: #28a745;
            color: white;
        }
        #navigation-numbers button.viewed {
            background-color: #dc3545;
            color: white;
        }

        #restart-button-container {
            display: flex;
            justify-content: center;
            width: 100%;
            position: sticky;
            top: 0;
            background-color: white;
            padding: 10px 0;
            z-index: 1001;
        }

        #restart-button {
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }
        #nav-summary {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .error-message {
          color: red;
          text-align: center;
          margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="quiz-container">
        <div id="language-selection">
            <h2>Select Language</h2>
            <button class="language-button" data-lang="hindi">हिन्दी</button>
            <button class="language-button" data-lang="english">English</button>
            <p id="error-lang" class="error-message" style="display:none;">Please select a language.</p>
        </div>
        <div id="quiz-content">
            <h2 id="quiz-title"></h2>
            <div id="nav-summary"></div>
            <div id="navigation-numbers"></div>
            <div class="question-section">
                <h3 id="question-text"></h3>
                <div id="options" class="options-section"></div>
            </div>
            <div class="navigation-section">
                <button id="prev-question" class="navigation-button">Previous</button>
                <button id="next-question" class="navigation-button">Next</button>
            </div>
            <button id="preview-answers" class="preview-button">Preview Answers</button>
            <button id="submit-quiz" class="submit-button">Submit Quiz</button>
        </div>
        <div class="preview-popup" id="preview-popup">
            <button onclick="document.getElementById('preview-popup').style.display='none'" class="top-close">Close</button>
            <h3>Preview Answers</h3>
            <div id="preview-content"></div>
        </div>
        <div id="result-section">
            <div id="restart-button-container">
                <button id="restart-button">Restart Quiz</button>
            </div>
            <h2>Quiz Results</h2>
            <div id="results"></div>
            <div id="result-summary"></div>
        </div>
    </div>

    <script>
        let userLanguage = null;
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let viewedQuestions = [];

        document.querySelectorAll('.language-button').forEach(button => {
            button.addEventListener('click', function() {
                userLanguage = this.dataset.lang;
                if(!userLanguage){
                  document.getElementById('error-lang').style.display = 'block';
                  return;
                }
                document.getElementById('error-lang').style.display = 'none';
                document.getElementById('language-selection').style.display = 'none';
                document.getElementById('quiz-content').style.display = 'block';
                loadQuiz();
            });
        });

        function loadQuiz() {
            const quizFile = localStorage.getItem('quizFile');
            const quizTitle = localStorage.getItem('quizTitle');
            if (!quizFile) {
                window.location.href = 'quizSelection.html';
                return;
            }
            document.getElementById('quiz-title').textContent = quizTitle;

            fetch(`questions/${quizFile}`)
                .then(response => response.json())
                .then(data => {
                    questions = data;
                    userAnswers = new Array(questions.length).fill(null);
                    generateNavigation();
                    loadQuestion(0);
                })
                .catch(error => {
                    console.error('Error loading quiz:', error);
                    alert("Error loading quiz data. Please check quiz file.");
                });
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const question = questions[index];
            document.getElementById('question-text').textContent = `${index + 1}. ${userLanguage === 'english' ? question.questionEnglish : question.questionHindi}`;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            const shuffledOptions = [...(question.options || [])].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="radio" name="answer" value="${option}" ${userAnswers[index] === option ? 'checked' : ''}> ${option}`;
                label.querySelector('input').addEventListener('change', () => saveAnswer(index, option));
                optionsContainer.appendChild(label);
            });
            highlightNavButton(index);
            markViewed(index);
            updateNavSummary();
        }

        function saveAnswer(index, answer) {
            userAnswers[index] = answer;
            document.getElementById(`nav-button-${index}`).classList.remove('viewed');
            document.getElementById(`nav-button-${index}`).classList.add('answered');
            updateNavSummary();
        }

        function generateNavigation() {
            const navContainer = document.getElementById('navigation-numbers');
            navContainer.innerHTML = questions.map((_, i) => `<button id="nav-button-${i}">${i + 1}</button>`).join('');
            questions.forEach((_, i) => document.getElementById(`nav-button-${i}`).addEventListener('click', () => loadQuestion(i)));
            if (questions.length > 0) document.getElementById(`nav-button-0`).classList.add('current');
            updateNavSummary();
        }
        function updateNavSummary() {
            const whiteButtons = document.querySelectorAll('#navigation-numbers button:not(.answered):not(.viewed)').length;
            const redButtons = document.querySelectorAll('#navigation-numbers button.viewed').length;
            const greenButtons = document.querySelectorAll('#navigation-numbers button.answered').length;
            document.getElementById('nav-summary').textContent = `White: ${whiteButtons}, Red: ${redButtons}, Green: ${greenButtons}`;
        }

        function highlightNavButton(index) {
            document.querySelectorAll('#navigation-numbers button').forEach(btn => btn.classList.remove('current'));
            document.getElementById(`nav-button-${index}`).classList.add('current');
        }

        function markViewed(index) {
            if (!viewedQuestions.includes(index) && userAnswers[index] === null) {
                viewedQuestions.push(index);
                document.getElementById(`nav-button-${index}`).classList.add('viewed');
                updateNavSummary();
            }
        }

        document.getElementById('prev-question').addEventListener('click', () => loadQuestion(Math.max(0, currentQuestionIndex - 1)));
        document.getElementById('next-question').addEventListener('click', () => loadQuestion(Math.min(questions.length - 1, currentQuestionIndex + 1)));

        document.getElementById('preview-answers').addEventListener('click', () => {
            const previewContent = questions.map((q, i) => `<p><strong>${i + 1}. ${userLanguage === 'english' ? q.questionEnglish : q.questionHindi}</strong><br>Your Answer: ${userAnswers[i] || 'Not Answered'}</p>`).join('');
            document.getElementById('preview-content').innerHTML = previewContent;
            document.getElementById('preview-popup').style.display = 'block';
        });

        document.getElementById('submit-quiz').addEventListener('click', () => {
            let correct = 0, attempted = 0;
            const results = questions.map((q, i) => {
                if (userAnswers[i]) attempted++;
                if (userAnswers[i] === q.correctAnswer) correct++;
                return `<p><strong>${i + 1}. ${userLanguage === 'english' ? q.questionEnglish : q.questionHindi}</strong><br>Your Answer: ${userAnswers[i] || 'Not Answered'}<br>Correct Answer: ${q.correctAnswer}</p>`;
            }).join('');

            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('results').innerHTML = results;
            document.getElementById('result-summary').innerHTML = `<p>Correct: ${correct} / Attempted: ${attempted} / Total: ${questions.length}</p>`;
        });

        document.getElementById('restart-button').addEventListener('click', () => {
            window.location.href = "index.html";
        });

        window.onload = () => {
            if (!localStorage.getItem('quizFile')) {
                window.location.href = 'quizSelection.html';
            }
        };
    </script>
</body>
</html>
