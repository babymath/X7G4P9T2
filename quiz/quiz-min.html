<!doctype html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>BabyMath Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&display=swap" rel=stylesheet>
<style>body{font-family:'Noto Sans Devanagari',sans-serif;margin:0;background-color:#fff;padding:0}#quiz-container{width:100%;padding:10px;box-sizing:border-box}#language-selection{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px}.language-button{padding:10px 20px;margin:10px;border:none;border-radius:5px;background-color:#4a90e2;color:#fff;cursor:pointer;font-size:16px;width:80%;max-width:300px}#quiz-content,#result-section{display:none}.question-section{margin-bottom:20px}.options-section label{display:block;margin:10px 0;padding:12px;border:1px solid #ddd;border-radius:5px;cursor:pointer}.navigation-section{display:flex;justify-content:space-between}.navigation-button{padding:10px 15px;border:none;border-radius:5px;background-color:#00bfff;color:#fff;cursor:pointer}#restart-button,.preview-button,.submit-button{padding:10px 15px;border:none;border-radius:5px;background-color:#3cb371;color:#fff;cursor:pointer;margin-top:20px;width:100%;box-sizing:border-box}.preview-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(255,255,255,.95);padding:20px;overflow-y:auto;box-sizing:border-box;z-index:1000;text-align:left}.preview-popup h3{text-align:center;margin-bottom:20px}.preview-popup button{padding:10px 15px;border:none;border-radius:5px;background-color:#df28a8;color:#fff;cursor:pointer;margin:0;text-align:center}.preview-popup .top-close{position:sticky;top:0;display:block;width:100%;text-align:center}#navigation-numbers{display:flex;flex-wrap:wrap;margin-bottom:15px}#navigation-numbers button{padding:8px 12px;margin:5px;border:1px solid #ddd;border-radius:3px;cursor:pointer;width:40px;height:40px;display:flex;justify-content:center;align-items:center}#navigation-numbers button.current{background-color:#007bff;color:#fff}#navigation-numbers button.answered{background-color:#28a745;color:#fff}#navigation-numbers button.viewed{background-color:#dc3545;color:#fff}#restart-button-container{display:flex;justify-content:center;width:100%;position:sticky;top:0;background-color:#fff;padding:10px 0;z-index:1001}#restart-button{margin:0;width:100%;box-sizing:border-box}#nav-summary{display:flex;justify-content:center;margin-bottom:10px;font-weight:700}.error-message{color:red;text-align:center;margin-top:10px}</style>
</head>
<body>
<div id=quiz-container>
<div id=language-selection>
<h2>Select Language</h2>
<button class=language-button data-lang=hindi>हिन्दी</button>
<button class=language-button data-lang=english>English</button>
<p id=error-lang class=error-message style=display:none>Please select a language.</p>
</div>
<div id=quiz-content>
<h2 id=quiz-title></h2>
<div id=nav-summary></div>
<div id=navigation-numbers></div>
<div class=question-section>
<h3 id=question-text></h3>
<div id=options class=options-section></div>
</div>
<div class=navigation-section>
<button id=prev-question class=navigation-button>Previous</button>
<button id=next-question class=navigation-button>Next</button>
</div>
<button id=preview-answers class=preview-button>Preview Answers</button>
<button id=submit-quiz class=submit-button>Submit Quiz</button>
</div>
<div class=preview-popup id=preview-popup>
<button onclick='document.getElementById("preview-popup").style.display="none"' class=top-close>Close</button>
<h3>Preview Answers</h3>
<div id=preview-content></div>
</div>
<div id=result-section>
<div id=restart-button-container>
<button id=restart-button>Restart Quiz</button>
</div>
<h2>Quiz Results</h2>
<div id=results></div>
<div id=result-summary></div>
</div>
</div>
<script>let userLanguage=null,questions=[],userAnswers=[],currentQuestionIndex=0,viewedQuestions=[];function loadQuiz(){const e=localStorage.getItem("quizFile"),n=localStorage.getItem("quizTitle");e?(document.getElementById("quiz-title").textContent=n,fetch(`questions/${e}`).then((e=>e.json())).then((e=>{questions=e,userAnswers=new Array(questions.length).fill(null),generateNavigation(),loadQuestion(0)})).catch((e=>{console.error("Error loading quiz:",e),alert("Error loading quiz data. Please check quiz file.")}))):window.location.href="quizSelection.html"}function loadQuestion(e){currentQuestionIndex=e;const n=questions[e];document.getElementById("question-text").textContent=`${e+1}. ${"english"===userLanguage?n.questionEnglish:n.questionHindi}`;const t=document.getElementById("options");t.innerHTML="";[...n.options||[]].sort((()=>Math.random()-.5)).forEach((n=>{const o=document.createElement("label");o.innerHTML=`<input type="radio" name="answer" value="${n}" ${userAnswers[e]===n?"checked":""}> ${n}`,o.querySelector("input").addEventListener("change",(()=>saveAnswer(e,n))),t.appendChild(o)})),highlightNavButton(e),markViewed(e),updateNavSummary()}function saveAnswer(e,n){userAnswers[e]=n,document.getElementById(`nav-button-${e}`).classList.remove("viewed"),document.getElementById(`nav-button-${e}`).classList.add("answered"),updateNavSummary()}function generateNavigation(){document.getElementById("navigation-numbers").innerHTML=questions.map(((e,n)=>`<button id="nav-button-${n}">${n+1}</button>`)).join(""),questions.forEach(((e,n)=>document.getElementById(`nav-button-${n}`).addEventListener("click",(()=>loadQuestion(n))))),questions.length>0&&document.getElementById("nav-button-0").classList.add("current"),updateNavSummary()}function updateNavSummary(){const e=document.querySelectorAll("#navigation-numbers button:not(.answered):not(.viewed)").length,n=document.querySelectorAll("#navigation-numbers button.viewed").length,t=document.querySelectorAll("#navigation-numbers button.answered").length;document.getElementById("nav-summary").textContent=`White: ${e}, Red: ${n}, Green: ${t}`}function highlightNavButton(e){document.querySelectorAll("#navigation-numbers button").forEach((e=>e.classList.remove("current"))),document.getElementById(`nav-button-${e}`).classList.add("current")}function markViewed(e){viewedQuestions.includes(e)||null!==userAnswers[e]||(viewedQuestions.push(e),document.getElementById(`nav-button-${e}`).classList.add("viewed"),updateNavSummary())}document.querySelectorAll(".language-button").forEach((e=>{e.addEventListener("click",(function(){userLanguage=this.dataset.lang,userLanguage?(document.getElementById("error-lang").style.display="none",document.getElementById("language-selection").style.display="none",document.getElementById("quiz-content").style.display="block",loadQuiz()):document.getElementById("error-lang").style.display="block"}))})),document.getElementById("prev-question").addEventListener("click",(()=>loadQuestion(Math.max(0,currentQuestionIndex-1)))),document.getElementById("next-question").addEventListener("click",(()=>loadQuestion(Math.min(questions.length-1,currentQuestionIndex+1)))),document.getElementById("preview-answers").addEventListener("click",(()=>{const e=questions.map(((e,n)=>`<p><strong>${n+1}. ${"english"===userLanguage?e.questionEnglish:e.questionHindi}</strong><br>Your Answer: ${userAnswers[n]||"Not Answered"}</p>`)).join("");document.getElementById("preview-content").innerHTML=e,document.getElementById("preview-popup").style.display="block"})),document.getElementById("submit-quiz").addEventListener("click",(()=>{let e=0,n=0;const t=questions.map(((t,o)=>{userAnswers[o]&&n++;const s=userAnswers[o]===t.correctAnswer;return s&&e++,`<p>\n                    <strong>${o+1}. ${"english"===userLanguage?t.questionEnglish:t.questionHindi}</strong>\n                    <br>Your Answer: ${userAnswers[o]||"Not Answered"} , Correct Answer: ${t.correctAnswer}\n                    ${s?'<br><span class="checkmark">✔️</span> Correct!':""}\n                    ${!s&&userAnswers[o]?'<br><span class="cross">❌</span> Incorrect.':""}\n                    <br><button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(("english"===userLanguage?t.questionEnglish:t.questionHindi)+" "+t.correctAnswer)}', '_blank')">Search</button>\n                </p>`})).join("");document.getElementById("quiz-content").style.display="none",document.getElementById("result-section").style.display="block",document.getElementById("results").innerHTML=t,document.getElementById("result-summary").innerHTML=`<p>Correct: ${e} / Attempted: ${n} / Total: ${questions.length}</p>`})),document.getElementById("restart-button").addEventListener("click",(()=>{window.location.href="index.html"})),window.onload=()=>{localStorage.getItem("quizFile")||(window.location.href="quizSelection.html")}</script>
</body>
</html>
