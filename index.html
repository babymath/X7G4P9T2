<!DOCTYPE html>
<html>
<head>
  <title>BabyMath Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <h2>Login to BabyMath</h2>

  <div id="loginDiv">
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="errorMsg" style="color:red;"></p>
  </div>

  <div id="buttonsDiv" style="display:none;">
    <h3>Welcome!</h3>
    <button onclick="uploadToDB()">Local to Database</button>
    <button onclick="downloadFromDB()">Database to Local</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
      storageBucket: "babymath-data.appspot.com",
      messagingSenderId: "535678073642",
      appId: "1:535678073642:web:964cda18a45c7b04a97c53",
      measurementId: "G-7CN48FECP3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let localGames = {
      "111-100": 0, "111-200": 0,
      "222-100": 0, "222-200": 0,
      "333-100": 0, "333-200": 0,
      "444-100": 0, "444-200": 0,
      "555-100": 0, "555-200": 0,
      "666-100": 0, "666-200": 0,
      "777-100": 0, "777-200": 0
    };

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          currentUser = userCredential.user;
          document.getElementById("loginDiv").style.display = "none";
          document.getElementById("buttonsDiv").style.display = "block";
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("errorMsg").innerText = "Login failed!";
        });
    }

    function uploadToDB() {
      if (!currentUser) return;
      const userEmail = currentUser.email;
      db.collection("babymath").doc(userEmail).set({
        games: localGames
      }, { merge: true }).then(() => {
        alert("Data uploaded to Firestore!");
      }).catch((err) => {
        alert("Upload error: " + err.message);
      });
    }

    function downloadFromDB() {
      if (!currentUser) return;
      const userEmail = currentUser.email;
      db.collection("babymath").doc(userEmail).get().then((doc) => {
        if (doc.exists && doc.data().games) {
          localGames = doc.data().games;
          alert("Data downloaded from Firestore!");
          console.log(localGames);
        } else {
          alert("No game data found.");
        }
      }).catch((err) => {
        alert("Download error: " + err.message);
      });
    }
  </script>
</body>
</html>
