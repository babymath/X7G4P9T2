<!DOCTYPE html>
<html>
<head>
  <title>Firebase Auth Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  1
  <h2>Login</h2>
  <div id="login-box">
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>

  <div id="actions" style="display:none;">
    <button onclick="downloadData()">Database → Local</button>
    <button onclick="uploadData()">Local → Database</button>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBFABtE8u3Bcnza2Aono9yFl6aN2f6F2zQ",
      authDomain: "babymath-data.firebaseapp.com",
      projectId: "babymath-data",
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userEmail = "";
    let field = {}; // This will store Firestore data (password, games)

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        userEmail = email;

        // Fetch Firestore document
        const doc = await db.collection("babymath").doc(email).get();
        if (doc.exists) {
          field = doc.data();
          document.getElementById("login-box").style.display = "none";
          document.getElementById("actions").style.display = "block";
        } else {
          document.getElementById("error").innerText = "Document not found in Firestore.";
        }
      } catch (error) {
        document.getElementById("error").innerText = "Login failed: " + error.message;
      }
    }

    async function downloadData() {
      if (field && field.games) {
        localStorage.setItem("games", JSON.stringify(field.games));
        alert("Games data saved to local storage.");
      } else {
        alert("No games data found.");
      }
    }

    async function uploadData() {
      const localGames = JSON.parse(localStorage.getItem("games"));
      if (localGames && userEmail) {
        await db.collection("babymath").doc(userEmail).update({
          games: localGames
        });
        alert("Games data uploaded to Firestore.");
      } else {
        alert("No local games data found.");
      }
    }
  </script>
</body>
</html>
