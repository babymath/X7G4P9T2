<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BabyMath</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>BabyMath</h1>
    <div class="apps">
      <a href="game" class="app">
        <div class="app-content">
          <span>&#x1F3AE;</span>
          <span>Game</span>
        </div>
      </a>
      <a href="profile" class="app">
        <div class="app-content">
          <span>&#x1F464;</span>
          <span>Profile</span>
        </div>
      </a>
      <a href="quiz" class="app">
        <div class="app-content">
          <span>&#x1F4DA;</span>
          <span>Test & Quiz</span>
        </div>
      </a>
      <a href="math-tricks" class="app">
        <div class="app-content">
          <span>&#x1F4DC;</span>
          <span>Math Tricks</span>
        </div>
      </a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('SW registered'))
        .catch(e => console.error('SW registration failed', e));
    }
  </script>
</body>
</html>
