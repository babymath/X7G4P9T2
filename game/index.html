<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Game Launcher</title><link rel="stylesheet" href="index.css"></head><body><div class="container"><h1>Select a Game</h1><div class="grid"><div class="list-item" data-type="111">Addition Practice</div><div class="list-item" data-type="222">Subtraction Practice</div><div class="list-item" data-type="333">Multiplication Practice</div><div class="list-item" data-type="444">Lightning Sum</div><div class="list-item" data-type="555">Table Practice</div><div class="list-item" data-type="666">Roman to Number</div><div class="list-item" data-type="777">Word to Number</div></div></div><script>const listItems=document.querySelectorAll('.list-item');listItems.forEach(item=>{item.addEventListener('click',()=>{const gameKey=item.getAttribute('data-type');window.location.href=`game.html?gameKey=${gameKey}`})});</script></body></html>
