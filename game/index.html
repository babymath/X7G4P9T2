<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="aadhaar/img/favicon.ico">
    <title>Game - BabyMath</title>
    <link rel="stylesheet" href="css-js/game.css">
    <style>
        /* ...existing code... */
        #line2 {
            position: sticky;
            top: 0;
            background-color: white; /* Ensure visibility */
            z-index: 10; /* Keep it above other elements */
            padding: 10px; /* Optional: Adjust padding for better appearance */
        }
        /* ...existing code... */
    </style>
</head>
<body>
    <!-- Game Menu Section -->
    <div id="game-menu">
        <div class="message-box" id="messageBox">Swipe Left/Right</div>
        <div class="dots-container" id="dotsContainer"></div>
        <div class="container">
            <div class="card-container"></div>
        </div>
    </div>

    <!-- Game Section -->
    <div id="game" style="display: none;">
        <!-- Header -->
        <div id="header1">
            <h1 id="title"></h1>
        </div>

        <!-- Main Content -->
        <div id="main1">
            <!-- Game Setup Section -->
            <section id="game-setup">
                <div id="changeMode">
                    <span id="timeModeLabel">🕛</span>
                    <label class="switch">
                        <input type="checkbox" id="modeCheckbox">
                        <span class="slider round"></span>
                    </label>
                    <span id="questionModeLabel">🔢</span>
                </div>
                <div id="choseMode">
                    <button class="mode1 timeMode" data-value="60">🕒60 sec</button>
                    <button class="mode1 timeMode" data-value="120">🕕120 sec</button>
                    <button class="mode1 timeMode" data-value="180">🕘180 sec</button>
                    <button class="mode1 timeMode" data-value="240">🕛240 sec</button>
                    <button class="mode1 questionMode" data-value="15">🔢15 Question</button>
                    <button class="mode1 questionMode" data-value="30">🔢30 Question</button>
                    <button class="mode1 questionMode" data-value="45">🔢45 Question</button>
                    <button class="mode1 questionMode" data-value="60">🔢60 Question</button>
                </div>
                <div id="type1">
                    <button class="typeOption" data-value="100" id="type11">2 digit<br>+<br>2 digit</button>
                    <button class="typeOption" data-value="200" id="type12">3 digit<br>+<br>3 digit</button>
                </div>
                <div id="start1">
                    <button id="startGame" disabled>Start</button>
                </div>
            </section>

            <!-- Game Play Section -->
            <section id="game-play" style="display: none;">
                <div id="line1">
                    <span id="time1">0</span>
                    <span id="question1">0</span>
                </div>
                <div id="line2">
                    <p id="questionText">0 + 0 =</p>
                </div>
                <div id="line3">
                    <input type="number" id="answer1" autocomplete="off" autofocus>
                </div>
                <label for="autoSubmit">
                    <input type="checkbox" id="autoSubmit">Auto Submit
                </label>
                <div id="line4">
                    <button id="submit1">Submit</button>
                </div>
            </section>

            <!-- Game Result Section -->
            <section id="game-result" style="display: none;">
                <div id="endMessage">Game Over</div>
                <div id="totalTime">0</div>
                <div id="totalQuestion">0</div>
                <div id="score1">0</div>
                <div id="highScore1">0</div>
                <div id="return1">
                    <button id="playAgain">Play Again</button>
                    <button id="backToSetup">Go To Setup</button>
                    <button id="backToMenu">Choose Game Again </button>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <div id="footer1">BabyMath</div>
    </div>

    <!-- Scripts -->
    <script src="css-js/game0.js"></script>
    <script src="css-js/game1.js"></script>
    <script src="css-js/game2.js"></script>
</body>
</html>
